name: Container image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and test image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build locally without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: trivia-test:local
          cache-from: type=gha,scope=trivia-amd64
          cache-to: type=gha,mode=max,scope=trivia-amd64
      - name: Run integration tests in the production image
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD/test,target=/app/test,readonly" \
            trivia-test:local node --test
      - name: Smoke test the default container command
        run: |
          docker run --detach --name trivia-smoke \
            --publish 127.0.0.1:3000:3000 --env OPENTDB=off trivia-test:local
          trap 'docker logs trivia-smoke; docker rm --force trivia-smoke' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 --max-time 3 http://127.0.0.1:3000/healthz
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null

  publish:
    name: Publish to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish main and commit tags
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vdovhanych/trivia-game:latest
            ghcr.io/vdovhanych/trivia-game:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/vdovhanych/trivia-game
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=trivia-amd64
          cache-to: type=gha,mode=max,scope=trivia-amd64
